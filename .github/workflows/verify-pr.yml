name: Lint

on:
  pull_request:
    paths:
      - "scripts/**"
      - "packaging/**"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "./scripts"

      - name: Install rpmlint
        run: sudo apt-get update && sudo apt-get install -y rpmlint

      - name: Lint spec file
        run: rpmlint packaging/claude-desktop.spec || true
