name: Build and release RPM

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Upstream version to pin (leave blank to build the latest from the apt repo)"
        required: false
  schedule:
    - cron: "0 6 * * 1"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - name: Install build dependencies
        run: dnf install -y git rpm-build tar binutils curl podman

      - uses: actions/checkout@v4

      - name: Build RPM
        id: build
        run: |
          ARGS=()
          if [ -n "${{ github.event.inputs.version }}" ]; then
            ARGS+=(--version "${{ github.event.inputs.version }}")
          fi
          bash scripts/build-rpm.sh "${ARGS[@]}"
          RPM_FILE=$(find dist -maxdepth 1 -name '*.rpm' | head -n1)
          VERSION=$(rpm -qp --qf '%{VERSION}' "$RPM_FILE")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify RPM
        run: |
          RPM_FILE=$(find dist -maxdepth 1 -name '*.rpm' | head -n1)
          bash scripts/verify-rpm.sh "$RPM_FILE"

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: claude-desktop-rpm
          path: dist/*.rpm

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.build.outputs.version }}
          files: dist/*.rpm
          generate_release_notes: true
